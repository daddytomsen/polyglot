<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polyglot">
<meta name="theme-color" content="#58cc02">
<title>Polyglot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg2:#f7f7f7; --card:#ffffff; --line:#e5e5e5; --ink:#3c3c3c; --ink2:#777777; --ink3:#afafaf;
  --green:#58cc02; --green-d:#46a302; --green-soft:#d7ffb8; --green-ink:#58a700;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-soft:#ffdfe0; --red-ink:#ea2b2b;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-soft:#ddf4ff;
  --gold:#ffc800; --gold-d:#e5a800; --flame:#ff9600; --flame-soft:#fff2e0; --purple:#ce82ff; --purple-soft:#f3e3ff; --purple-ink:#9b4dd4;
  --r:16px; --r-lg:24px; --shadow:0 2px 0 var(--line);
  --f:"Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131f24; --bg2:#0f181c; --card:#1b2b32; --line:#37464f; --ink:#f1f7fb; --ink2:#dce6ec; --ink3:#8da1ab;
  --green-soft:#1f3b12; --red-soft:#4a1d1d; --blue-soft:#17323f; --flame-soft:#3d2a10; --purple-soft:#33224a;
  --green-ink:#7ee22a; --red-ink:#ff6b6b; --purple-ink:#d9a6ff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:700;font-size:17px;line-height:1.35;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit}
#frame{min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:720px){
  body{background:var(--bg2);display:flex;justify-content:center}
  #frame{width:440px;min-height:100dvh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
#app{flex:1;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px 0}
.sr{position:absolute;left:-9999px}
.hidden{display:none !important}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:var(--r);font-weight:900;font-size:16px;letter-spacing:.6px;text-transform:uppercase;
  background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .06s,box-shadow .06s;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn[disabled]{background:var(--line);color:var(--ink3);box-shadow:none;transform:none;cursor:default}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)} .btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);border-bottom:0}
.btn.ghost:active,.btn.red:active,.btn.blue:active{box-shadow:none}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:12px}

/* Start */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:17px}
.stat.flame{color:var(--flame)} .stat.flame.off{color:var(--ink3);filter:grayscale(1)} .stat.gold{color:var(--gold-d)}
.stat .em{font-size:22px;line-height:1}
.hero{background:linear-gradient(135deg,var(--green) 0%,#2fb8ff 100%);color:#fff;border-radius:var(--r-lg);padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.hero h1{margin:0 0 4px;font-size:22px;font-weight:900;line-height:1.1}
.hero p{margin:0;opacity:.92;font-size:14px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg)} .ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;line-height:1;text-align:center}
.ring b small{font-size:9px;opacity:.85;font-weight:800;margin-top:2px}
h2{font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 button{font-size:12px;color:var(--blue);text-transform:none;letter-spacing:0}
.langs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lang{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 4px 8px;text-align:center;box-shadow:var(--shadow)}
.lang .fl{font-size:28px;line-height:1} .lang small{display:block;font-size:10px;color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang .bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden} .lang .bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900}
.pill.purple{background:var(--purple-soft);color:var(--purple-ink)} .pill.flame{background:var(--flame-soft);color:var(--flame)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:13px;font-weight:800;color:var(--ink2)}
.chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:96px;padding-top:6px}
.box{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;color:var(--ink2)}
.box i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--blue);min-height:6px}
.box b{color:var(--ink);font-size:14px}
nav.tabs{display:flex;justify-content:space-around;border-top:2px solid var(--line);background:var(--bg);padding:8px 0 max(10px,env(safe-area-inset-bottom));margin:auto -16px 0;position:sticky;bottom:0}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:4px 14px;border-radius:12px;font-weight:800}
nav.tabs button .em{font-size:24px;filter:grayscale(1);opacity:.6} nav.tabs button.on{color:var(--blue);background:var(--blue-soft)} nav.tabs button.on .em{filter:none;opacity:1}
.spacer{height:16px}

/* Runde */
.lhead{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.x{font-size:28px;color:var(--ink3);width:32px;line-height:1}
.prog{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:var(--green);transition:width .4s cubic-bezier(.2,.8,.2,1);position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.combo{display:inline-flex;align-items:center;gap:3px;color:var(--flame);font-weight:900;min-width:44px;justify-content:flex-end}
.prompt{text-align:center;padding:4px 0 14px}
.prompt .em{font-size:64px;line-height:1.1;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.prompt h3{margin:8px 0 2px;font-size:28px;font-weight:900}
.prompt small{color:var(--ink2);font-size:14px}
.kind{display:inline-block;margin-top:6px;background:var(--purple-soft);color:var(--purple-ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}
.lanes{display:flex;flex-direction:column;gap:10px}
.lane{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 8px;transition:background .2s,border-color .2s}
.lane .fl{font-size:30px;text-align:center;line-height:1} .lane .fl small{display:block;font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;font-weight:900}
.lane input{width:100%;border:0;background:transparent;color:var(--ink);font-weight:800;font-size:18px;padding:8px 4px;outline:none}
.lane input::placeholder{color:var(--ink3);font-weight:700}
.lane.ok{background:var(--green-soft);border-color:var(--green)} .lane.bad{background:var(--red-soft);border-color:var(--red)}
.lane .sol{font-size:13px;color:var(--red-ink);font-weight:800;padding:0 4px 4px;display:flex;align-items:center;gap:8px} .lane.ok .sol{color:var(--green-ink)}
.lane .sol i{font-style:normal;opacity:.85} .lane .sol button{font-size:18px;margin-left:auto}
.tiles{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0}
.tile{padding:8px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:17px;transition:transform .06s}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile.sel{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);box-shadow:0 3px 0 var(--blue)}
.tile small{display:block;font-size:10px;color:var(--ink3);font-weight:800;line-height:1}
.foot{padding:14px 0 max(14px,env(safe-area-inset-bottom));border-top:2px solid var(--line);margin-top:auto;background:var(--bg)}
#sheet{position:fixed;left:0;right:0;bottom:0;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:18px 16px max(18px,env(safe-area-inset-bottom));border-radius:24px 24px 0 0;z-index:5;max-width:440px;margin:0 auto}
#sheet.show{transform:none}
#sheet.ok{background:var(--green-soft);color:var(--green-ink)} #sheet.bad{background:var(--red-soft);color:var(--red-ink)} #sheet.info{background:var(--card);color:var(--ink);border-top:2px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.15)}
#sheet h4{margin:0 0 4px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
#sheet p{margin:0 0 14px;font-size:15px;font-weight:800;opacity:.95}
#sheet.ok .btn{background:var(--green);box-shadow:0 4px 0 var(--green-d);color:#fff} #sheet.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d);color:#fff}
.xpfloat{position:fixed;right:24px;top:70px;color:var(--gold);font-weight:900;font-size:22px;animation:up 1s ease-out forwards;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.15);z-index:6}
@keyframes up{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.shake{animation:shake .35s} @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.modeswitch{display:flex;justify-content:center;gap:6px;margin:0 0 12px}
.modeswitch button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:900;color:var(--ink3);border:2px solid var(--line);text-transform:uppercase;letter-spacing:.6px}
.modeswitch button.on{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}

/* Ergebnis */
.result{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:40px}
.result .big{font-size:84px;line-height:1;animation:pop .6s cubic-bezier(.2,1.4,.4,1)} @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.result h1{font-size:30px;margin:14px 0 4px;color:var(--gold-d);font-weight:900} .result p{margin:0 0 22px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.st{border-radius:var(--r);padding:3px;color:#fff;text-align:center} .st > div{background:var(--card);border-radius:13px;padding:10px 6px;color:var(--ink);font-weight:900;font-size:20px}
.st small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:5px 0 6px;font-weight:900}
.st.gold{background:var(--gold)} .st.gold small{color:#5a4300} .st.blue{background:var(--blue)} .st.green{background:var(--green)}
.streakcard{margin-top:22px;width:100%;background:var(--flame-soft);border-radius:var(--r-lg);padding:18px;display:flex;align-items:center;gap:16px;text-align:left}
.streakcard .em{font-size:52px;animation:flick 1.1s ease-in-out infinite alternate} @keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}
.streakcard b{display:block;font-size:26px;color:var(--flame)} .streakcard span{color:var(--ink2);font-size:14px}
.week{display:flex;gap:6px;margin-top:10px} .week i{flex:1;height:30px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:11px;font-style:normal;color:var(--ink3);font-weight:900}
.week i.on{background:var(--flame);color:#fff} .week i.today{outline:2px solid var(--flame);outline-offset:-2px}
.promos{width:100%;margin-top:14px;text-align:left}
.promo{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px} .promo:last-child{border:0} .promo .em{font-size:24px} .promo .arrow{margin-left:auto;color:var(--green-ink);font-weight:900}
.promo .arrow.down{color:var(--red-ink)}

/* Kasten & Profil */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:8px 12px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font-weight:800;outline:none;font-size:16px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;width:100%}
.item .em{font-size:22px;width:28px;text-align:center} .item b{flex:1;font-size:15px} .item small{color:var(--ink2);font-size:12px}
.fachdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;background:var(--ink3)}
.fachdot.f2{background:var(--blue)} .fachdot.f3{background:var(--purple)} .fachdot.f4{background:var(--flame)} .fachdot.f5{background:var(--green)} .fachdot.f0{background:var(--line);color:var(--ink3)}
.detail{display:flex;flex-direction:column;gap:8px}
.detail .drow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg2);border-radius:12px}
.detail .drow .fl{font-size:24px} .detail .drow b{font-size:18px} .detail .drow small{color:var(--ink2);font-size:12px;display:block} .detail .drow button{margin-left:auto;font-size:20px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border:0} .setting span{font-size:15px} .setting small{display:block;color:var(--ink2);font-size:12px;font-weight:700}
.seg{display:flex;gap:4px;background:var(--bg2);border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:900;color:var(--ink2)} .seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s} .toggle.on{background:var(--green)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)} .toggle.on::after{left:23px}
.note{font-size:13px;color:var(--ink2);font-weight:700;line-height:1.4}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:800;opacity:0;transition:all .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:8;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.onb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;padding-bottom:30px}
.onb .em{font-size:72px} .onb h1{margin:0;font-size:28px;font-weight:900} .onb p{margin:0;color:var(--ink2)}
</style>
</head>
<body>
<div id="frame"><div id="app"></div></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
(function () {
'use strict';
/* ---------- Konstanten ---------- */
const VERSION = '0.1.0';
const K_PROG = 'polyglot.prog.v1', K_PACKS = 'polyglot.packs.v1';
const LANGS = ['es', 'fr', 'it', 'ja', 'zh'];
const FLAG = { es: '🇪🇸', fr: '🇫🇷', it: '🇮🇹', ja: '🇯🇵', zh: '🇨🇳' };
const NAME = { es: 'Spanisch', fr: 'Französisch', it: 'Italienisch', ja: 'Japanisch', zh: 'Chinesisch' };
const VOICE = { es: 'es-ES', fr: 'fr-FR', it: 'it-IT', ja: 'ja-JP', zh: 'zh-CN' };
const TILE_DEFAULT = { es: false, fr: false, it: false, ja: true, zh: true };
const POS = { noun: 'Nomen', verb: 'Verb', adj: 'Adjektiv', adv: 'Adverb' };
const TEMPOS = { fast: [0, 0, 1, 1, 1, 7], long: [0, 0, 1, 3, 7, 14] };   // Wartetage je Fach (Index = Fach), wie Voc a Bit 1.12
const GOALS = [50, 100, 150, 250];
const ROUND = 5;
const PRAISE = ['Stark!', 'Genau so!', 'Sauber!', 'Weiter so!', 'Top!'];

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]] } return a };
const pick = a => a[Math.random() * a.length | 0];
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dayKey(new Date());
function dayShift(key, n) { const [y, m, d] = key.split('-').map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() + n); return dayKey(dt) }
const yesterdayKey = () => dayShift(todayKey(), -1);

/* ---------- Zustand ---------- */
function defaultProg() {
  return { v: 1, goal: 100, tempo: 'fast', modus: 'mix', sound: true, speak: true, xp: 0, days: {}, streak: 0, best: 0, last: '',
    rounds: 0, perfect: 0, volltreffer: 0, bestCombo: 0, w: {}, themen: [], onboarded: false, updatedAt: 0 };
}
const S = { prog: null, pack: null, view: 'home', tab: 'home', quiz: null, result: null, tiles: null, q: '', fach: 0, detail: null };

function loadProg() {
  try { const p = JSON.parse(localStorage.getItem(K_PROG) || 'null'); S.prog = Object.assign(defaultProg(), p || {}) } catch (e) { S.prog = defaultProg() }
  S.tiles = modeTiles(S.prog.modus);
}
function persist() { S.prog.updatedAt = Date.now(); try { localStorage.setItem(K_PROG, JSON.stringify(S.prog)) } catch (e) { toast('Speichern fehlgeschlagen') } }
function modeTiles(m) { const t = {}; for (const l of LANGS) t[l] = m === 'tile' ? true : m === 'type' ? false : TILE_DEFAULT[l]; return t }

/* ---------- Paket laden ---------- */
async function loadPack() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(K_PACKS) || 'null') } catch (e) { }
  if (cached) S.pack = cached;
  try {
    const idx = await (await fetch('packs/index.json', { cache: 'no-cache' })).json();
    const meta = idx.packs[0];
    if (!cached || cached.rev !== meta.rev || cached.id !== meta.id) {
      const pack = await (await fetch('packs/' + meta.datei, { cache: 'no-cache' })).json();
      S.pack = pack;
      try { localStorage.setItem(K_PACKS, JSON.stringify(pack)) } catch (e) { }
      if (cached) toast('Vokabelpaket aktualisiert: ' + pack.titel);
    }

}
function showDetail(id) {
  const c = S.byId[id], w = W(id), sheet = $('#sheet');
  sheet.className = 'info show';
  sheet.innerHTML = `<h4><span>${c.emoji}</span>${esc(c.de)} <span class="pill purple" style="margin-left:auto">${w ? 'Fach ' + w.l : 'neu'}</span></h4>
    <p class="note" style="margin-bottom:10px">${POS[c.pos] || c.pos} · ${esc(c.thema)} · englisch <i>${esc(c.en)}</i>${w ? ` · ${w.r}× Volltreffer, ${w.x}× daneben${w.d ? ', fällig ' + (w.d <= todayKey() ? 'jetzt' : 'am ' + w.d.slice(8) + '.' + w.d.slice(5, 7) + '.') : ''}` : ''}</p>
    <div class="detail">${LANGS.map(l => { const s = c.sprachen[l], st = w && w.s[l]; return `<div class="drow"><span class="fl">${FLAG[l]}</span><div><b>${esc(s.w)}</b><small>${s.roman ? esc(s.roman) + ' · ' : ''}${NAME[l]}${st ? ` · ${st.r}/${st.r + st.x} richtig` : ''}</small></div><button data-act="say" data-lang="${l}" data-w="${esc(s.w)}" aria-label="Vorlesen">🔊</button></div>` }).join('')}</div>
    <div style="height:12px"></div><button class="btn ghost" data-act="close">Schließen</button>`;
}

/* ---------- Profil ---------- */
function viewProfile() {
  const p = S.prog, learned = S.cards.filter(c => fachOf(c.id) >= 4).length;
  const seg = (opts, cur, act, key) => `<div class="seg">${opts.map(([v, l]) => `<button class="${String(cur) === String(v) ? 'on' : ''}" data-act="${act}" data-${key}="${v}">${l}</button>`).join('')}</div>`;
  return `
  <h2 style="margin-top:4px">Profil</h2>
  <div class="card"><div class="row"><span style="font-size:40px">🔥</span><div><b style="font-size:22px;display:block">${shownStreak()} Tage Serie</b><span class="note">Beste Serie ${p.best} · ${p.rounds} Runden · ${p.volltreffer} Volltreffer · ${learned} Karten gelernt (Fach 4–5)</span></div></div>${weekHTML()}</div>
  <h2>Einstellungen</h2>
  <div class="card">
    <div class="setting"><span>Tagesziel<small>XP pro Tag, damit die Serie zählt</small></span>${seg(GOALS.map(g => [g, g]), p.goal, 'goal', 'v')}</div>
    <div class="setting"><span>Lerntempo<small>${p.tempo === 'fast' ? 'Jeden Tag ein Fach, Fach 5 nach 4 Tagen' : 'Wartezeiten 1, 3, 7, 14 Tage'}</small></span>${seg([['fast', 'Schnell'], ['long', 'Langzeit']], p.tempo, 'tempo', 'v')}</div>
    <div class="setting"><span>Eingabe<small>Japanisch und Chinesisch bei „Gemischt“ per Kachel</small></span>${seg([['type', '⌨️'], ['tile', '🧩'], ['mix', '✨']], p.modus, 'mode', 'm')}</div>
    <div class="setting"><span>Töne</span><button class="toggle ${p.sound ? 'on' : ''}" data-act="toggle" data-k="sound" aria-label="Töne"></button></div>
    <div class="setting"><span>Vorlesen<small>Lautsprecher-Knopf nach dem Prüfen; nutzt die Stimmen des Geräts</small></span><button class="toggle ${p.speak ? 'on' : ''}" data-act="toggle" data-k="speak" aria-label="Vorlesen"></button></div>
  </div>
  <h2>Sicherung</h2>
  <div class="card"><div class="row"><button class="btn blue sm" data-act="backup">Speichern</button><button class="btn ghost sm" data-act="restore">Laden</button><input type="file" accept="application/json,.json" class="hidden" id="restoreFile"><button class="btn red sm" data-act="reset" style="margin-left:auto">Zurücksetzen</button></div><p class="note" style="margin:10px 0 0">Der Lernstand liegt nur auf diesem Gerät. Beim Speichern öffnet sich auf dem iPhone das Teilen-Menü („In Dateien sichern“).</p></div>
  <h2>Über</h2>
  <div class="card note">Polyglot Version ${VERSION} · Paket „${esc(S.pack.titel)}“ rev ${S.pack.rev}, ${S.cards.length} Begriffe.<br><br>${esc(S.pack.lizenz)}. Die Vokabeldaten stehen unter CC BY-SA 3.0.<br><br>Eine Karte steigt nur auf, wenn alle fünf Sprachen in derselben Abfrage richtig sind. Falsche Sprachen kommen in der Runde noch einmal; die Karte geht zurück in Fach 1.</div>
  <div class="spacer"></div>${tabsHTML()}`;
}
function viewOnboard() {
  return `<div class="onb"><span class="em">🌍</span><h1>Polyglot</h1><p>Ein Begriff, fünf Sprachen. Eine Karte steigt erst auf, wenn du sie auf Spanisch, Französisch, Italienisch, Japanisch und Chinesisch richtig hast.</p>
    <div class="card" style="text-align:left"><div class="setting"><span>Tagesziel<small>XP pro Tag für die Serie</small></span><div class="seg">${GOALS.map(g => `<button class="${S.prog.goal === g ? 'on' : ''}" data-act="goal" data-v="${g}">${g}</button>`).join('')}</div></div>
    <div class="setting"><span>Eingabe<small>Tippen, Kacheln oder gemischt</small></span><div class="seg">${[['type', '⌨️'], ['tile', '🧩'], ['mix', '✨']].map(([v, l]) => `<button class="${S.prog.modus === v ? 'on' : ''}" data-act="mode" data-m="${v}">${l}</button>`).join('')}</div></div></div>
    <button class="btn" data-act="onboarded">Los geht's</button><p class="note">${S.cards.length} Begriffe im Paket „${esc(S.pack.titel)}“ · Lernstand bleibt auf diesem Gerät</p></div>`;
}

/* ---------- Sicherung ---------- */
async function backup() {
  const json = JSON.stringify({ app: 'polyglot', v: 1, exported: new Date().toISOString(), prog: S.prog }, null, 1);
  const name = `polyglot-sicherung-${todayKey()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Polyglot Sicherung' }); return }
  } catch (e) { if (e.name === 'AbortError') return }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 1000);
}
function restore(file) {
  const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (d.app !== 'polyglot' || !d.prog) throw 0; S.prog = Object.assign(defaultProg(), d.prog); S.tiles = modeTiles(S.prog.modus); persist(); toast('Sicherung geladen'); render() } catch (e) { toast('Das ist keine Polyglot-Sicherung.') } }; r.readAsText(file);
}

/* ---------- Render & Ereignisse ---------- */
function render() {
  const app = $('#app');
  if (!S.prog.onboarded) { app.innerHTML = viewOnboard(); return }
  app.innerHTML = ({ home: viewHome, round: viewRound, result: viewResult, box: viewBox, profile: viewProfile })[S.view]();
  if (S.view !== 'round') window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  unlockAudio();
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, p = S.prog;
  switch (act) {
    case 'start': startRound(); break;
    case 'check': doCheck(); break;
    case 'next': next(); break;
    case 'quit': quitRound(); break;
    case 'home': S.view = 'home'; S.tab = 'home'; render(); break;
    case 'tab': S.tab = b.dataset.tab; S.view = b.dataset.tab; hideSheet(); render(); break;
    case 'tile': { const l = b.dataset.lang; Q().answers[l] = Q().answers[l] === b.dataset.w ? '' : b.dataset.w; render(); break }
    case 'mode': p.modus = b.dataset.m; S.tiles = modeTiles(p.modus); persist(); render(); focusFirst(); break;
    case 'goal': p.goal = Number(b.dataset.v); persist(); render(); break;
    case 'tempo': { const from = p.tempo, to = b.dataset.v; if (from !== to) { reschedule(from, to); p.tempo = to; persist(); render() } break }
    case 'toggle': p[b.dataset.k] = !p[b.dataset.k]; persist(); render(); break;
    case 'thema': { const t = b.dataset.t; let sel = p.themen.length ? p.themen.slice() : S.pack.themen.slice(); sel = sel.includes(t) ? sel.filter(x => x !== t) : sel.concat(t); p.themen = sel.length >= S.pack.themen.length || !sel.length ? [] : sel; persist(); render(); break }
    case 'themen-alle': p.themen = []; persist(); render(); break;
    case 'fach': S.fach = Number(b.dataset.f); render(); break;
    case 'detail': showDetail(b.dataset.id); break;
    case 'close': hideSheet(); break;
    case 'say': say(b.dataset.w, b.dataset.lang); break;
    case 'onboarded': p.onboarded = true; persist(); render(); break;
    case 'backup': backup(); break;
    case 'restore': $('#restoreFile').click(); break;
    case 'reset': if (confirm('Lernstand wirklich löschen? Serie, XP und alle Fächer gehen verloren.')) { const keep = { goal: p.goal, tempo: p.tempo, modus: p.modus, sound: p.sound, speak: p.speak, onboarded: true }; S.prog = Object.assign(defaultProg(), keep); persist(); toast('Lernstand gelöscht'); render() } break;
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.in === 'q') { S.q = e.target.value; const list = $('#app .list'); if (list) { const html = viewBox(); const tmp = document.createElement('div'); tmp.innerHTML = html; list.innerHTML = tmp.querySelector('.list').innerHTML } return }
  const l = e.target.dataset.lang; if (!l || !Q()) return;
  Q().answers[l] = e.target.value; const btn = $('[data-act="check"]'); if (btn) btn.disabled = !cur().langs.every(x => (Q().answers[x] || '').trim());
});
document.addEventListener('change', e => { if (e.target.id === 'restoreFile' && e.target.files[0]) { restore(e.target.files[0]); e.target.value = '' } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || S.view !== 'round') return;
  if (Q().checked) return next();
  const inputs = [...document.querySelectorAll('#app .lane input')], i = inputs.indexOf(document.activeElement);
  if (i >= 0 && i < inputs.length - 1) { inputs[i + 1].focus(); return }
  const btn = $('[data-act="check"]'); if (btn && !btn.disabled) doCheck();
});
document.addEventListener('touchend', unlockAudio, { once: true });

/* ---------- Boot ---------- */
loadProg();
loadPack().then(() => {
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
}).catch(() => { });
})();
</script>
</body>
</html>
